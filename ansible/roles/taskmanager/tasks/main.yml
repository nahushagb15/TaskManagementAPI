---
- name: Check Docker availability
  command: docker --version
  changed_when: false

- name: Build Task Management API Docker image
  community.docker.docker_image:
    name: "{{ docker_image }}"
    source: build
    build:
      path: "{{ playbook_dir }}/.."
      dockerfile: Dockerfile
    state: present
    force_source: true
  notify: Docker image built
